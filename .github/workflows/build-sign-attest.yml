name: build-sign-attest

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"
      - ".grype.yaml"
  workflow_dispatch:

# Default deny: every job must declare what it needs
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR (built-in GITHUB_TOKEN, no stored secrets)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          push: true
          provenance: false # SLSA provenance comes from Task 5
          sbom: false       # SBOM comes from syft in the scan job
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Show digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Pushed ${IMAGE}@${DIGEST}"

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout (for .grype.yaml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (SPDX JSON, by digest)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Vulnerability scan (fail on Critical with a fix available)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: json
          output-file: grype-report.json
          config: .grype.yaml

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-and-scan
          path: |
            sbom.spdx.json
            grype-report.json
          if-no-files-found: error

  sign:
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write   # push signature/attestation to GHCR
      id-token: write   # OIDC token for keyless signing (Fulcio)
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-and-scan

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless, by digest)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest SBOM (SPDX)
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

  provenance:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write        # OIDC token for keyless attestation signing
      attestations: write    # publish to GitHub's attestation store
      packages: write        # attach a copy to the GHCR image
      contents: read
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
